const ORIGIN = 'https://dungeons2build.com';
const PROXY = 'https://api.allorigins.win/raw?url=';

async function loadSite() {
  try {
    const res = await fetch(PROXY + encodeURIComponent(ORIGIN + '/'));
    const html = await res.text();
    
    // Create a DOM parser
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    
    // Translate all text nodes
    function translateNode(node) {
      if (node.nodeType === 3) { // Text node
        const text = node.textContent.trim();
        if (text && TRANSLATIONS[text]) {
          node.textContent = node.textContent.replace(text, TRANSLATIONS[text]);
        }
      } else if (node.nodeType === 1) { // Element node
        // Translate title attributes
        if (node.hasAttribute && node.hasAttribute('title')) {
          const t = node.getAttribute('title');
          if (TRANSLATIONS[t]) node.setAttribute('title', TRANSLATIONS[t]);
        }
        // Translate alt attributes
        if (node.hasAttribute && node.hasAttribute('alt')) {
          const t = node.getAttribute('alt');
          if (TRANSLATIONS[t]) node.setAttribute('alt', TRANSLATIONS[t]);
        }
        for (const child of node.childNodes) {
          translateNode(child);
        }
      }
    }
    translateNode(doc.body);
    
    // Fix all resource paths to absolute URLs
    doc.querySelectorAll('img, script, link, source').forEach(el => {
      ['src', 'href'].forEach(attr => {
        let val = el.getAttribute(attr);
        if (val && val.startsWith('/') && !val.startsWith('//')) {
          el.setAttribute(attr, ORIGIN + val);
        }
      });
    });
    
    // Also fix CSS background images in style tags
    const styles = doc.querySelectorAll('style');
    styles.forEach(s => {
      let css = s.textContent;
      css = css.replace(/url\(\/(?!\/)/g, 'url(' + ORIGIN + '/');
      s.textContent = css;
    });
    
    // Write the translated HTML to the document
    document.open();
    document.write('<!DOCTYPE html>\n' + doc.documentElement.outerHTML);
    document.close();
    
  } catch (e) {
    document.getElementById('loading').innerHTML = '<h1>加载失败</h1><p>' + e.message + '</p><p>请直接访问 <a href="https://dungeons2build.com" target="_blank">原站</a></p>';
  }
}
